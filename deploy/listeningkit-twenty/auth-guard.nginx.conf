worker_processes auto;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 3000;
    server_name twenty.listeningkit.com;
    client_max_body_size 50m;
    set $twenty_upstream http://server:3000;

    auth_basic "ListeningKit Administration";
    auth_basic_user_file /etc/nginx/htpasswd;

    location ~ ^/(assets|images|icons|file)/ {
      auth_basic off;
      proxy_pass $twenty_upstream;
      include /etc/nginx/proxy-params.conf;
    }

    location ~ ^/(manifest\.json|client-config|favicon\.ico)$ {
      auth_basic off;
      proxy_pass $twenty_upstream;
      include /etc/nginx/proxy-params.conf;
    }

    location / {
      proxy_pass $twenty_upstream;
      include /etc/nginx/proxy-params.conf;
      proxy_set_header Authorization "";
    }
  }
}
