pre-commit:
  commands:
    privacy:
      run: bun run check:privacy --staged

    noComments:
      run: bun run check:noComments

    twikitTransport:
      run: bun run check:twikitTransport

    reverseChudTransport:
      run: bun run check:reverseChudTransport

    linkedinTransport:
      run: bun run check:linkedinTransport

    slackTransport:
      run: bun run check:slackTransport
    instagramTransport:
      run: bun run check:instagramTransport

    platforms:
      run: bun run check:platforms

    agnostic:
      run: bun run check:agnostic

    platformNeutral:
      run: bun run check:platformNeutral

    layout:
      run: bun run check:layout

    oneDatabase:
      run: bun run check:oneDatabase

    hiddenWindows:
      run: bun run check:hiddenWindows

    commitLog:
      run: node scripts/commitLog/commitLog.mjs

    browserParity:
      run: bun run check:browsers

    consoleParity:
      run: bun run check:consoleParity

    agentHooks:
      run: bun run check:agentHooks

    docs:
      run: bun run check:docs

    siteDocs:
      run: bun run check:siteDocs

    siteSkills:
      run: bun run check:siteSkills --staged

    specs:
      run: bun run check:specs --staged

post-commit:
  commands:
    commitLog:
      run: node scripts/commitLog/commitLog.mjs --committed

pre-push:
  parallel: false
  commands:
    privacy:
      run: bun run check:privacy

    noComments:
      run: bun run check:noComments

    twikitTransport:
      run: bun run check:twikitTransport

    reverseChudTransport:
      run: bun run check:reverseChudTransport

    linkedinTransport:
      run: bun run check:linkedinTransport

    slackTransport:
      run: bun run check:slackTransport
    instagramTransport:
      run: bun run check:instagramTransport

    platforms:
      run: bun run check:platforms

    agnostic:
      run: bun run check:agnostic

    platformNeutral:
      run: bun run check:platformNeutral

    naming:
      run: bun run check:naming

    layout:
      run: bun run check:layout

    oneDatabase:
      run: bun run check:oneDatabase

    hiddenWindows:
      run: bun run check:hiddenWindows

    browserParity:
      run: bun run check:browsers

    consoleParity:
      run: bun run check:consoleParity

    agentHooks:
      run: bun run check:agentHooks

    docs:
      run: bun run check:docs

    siteDocs:
      run: bun run check:siteDocs

    siteSkills:
      run: bun run check:siteSkills

    specs:
      run: bun run check:specs

    typecheck:
      run: bun run typecheck

    test:
      run: bun test

    clientDocs:
      run: bun run check:clientDocs
