# Git hooks, managed by lefthook (https://github.com/evilmartians/lefthook).
# `bun install` installs them (`prepare`). Never skip them with --no-verify.

# Rule 5: every commit adds a log.md entry. The hook parses the staged code
# into an abstract syntax tree and refuses the commit until the entry's
# What changed / Why / Checked are written from it (skills/commitLog/SKILL.md).
pre-commit:
  commands:
    commitLog:
      run: node scripts/commitLog.mjs

    # Rule 44: every browser has the same pieces (its src/browser/<name> domain, capability row,
    # driver, tests, Python opener and docs/browsers.md column). A capability may be notBuilt;
    # those are listed, never refused (docs/browsers.md).
    browserParity:
      run: bun run check:browsers

    # Rule 55: the CLI's commands, the MCP tools, the agent hooks (Claude Code's
    # .claude/settings.json, Codex's .codex/hooks.json) and the live log stay in
    # step: both hosts' hooks are written from src/agentHooks/registry, every MCP
    # tool is hooked, every hook script answers its events, and every resolver a
    # page state names is a real command (scripts/checkAgentHooks.ts).
    agentHooks:
      run: bun run check:agentHooks

pre-push:
  parallel: false
  commands:
    # Rule 1: camelCase everywhere.
    naming:
      run: bun run check:naming

    browserParity:
      run: bun run check:browsers

    agentHooks:
      run: bun run check:agentHooks

    typecheck:
      run: bun run typecheck

    test:
      run: bun test

    # Rules 25 and 27: every request Facebook's pages made in our runs has a
    # doc in docs/platforms/facebook/, rea has read each GraphQL request's slice,
    # the reasoning is written, and no run is newer than the last docs build
    # (`bun bin/log.ts capture --docs`). Why: AGENTS.md, "How we fix
    # problems", and docs/platforms/facebook/README.md.
    facebookClientDocs:
      run: bun run check:facebookClientDocs
