pre-commit:
  parallel: true
  jobs:
    - name: privacy
      run: bun run check:privacy --staged

    - name: noComments
      run: bun run check:noComments
      exclude: &prose
        - "*.md"
        - "*.mmd"
        - "*.txt"
        - "*.png"
        - "*.jpg"
        - "*.webp"
        - "*.gif"
        - "*.svg"
        - "*.webm"

    - name: twikitTransport
      run: bun run check:twikitTransport
      exclude: *prose

    - name: reverseChudTransport
      run: bun run check:reverseChudTransport
      exclude: *prose

    - name: oneIdentity
      run: bun run check:oneIdentity
      exclude: *prose

    - name: identityGate
      run: bun run check:identityGate
      exclude: *prose

    - name: linkedinTransport
      run: bun run check:linkedinTransport
      exclude: *prose

    - name: slackTransport
      run: bun run check:slackTransport
      exclude: *prose

    - name: instagramTransport
      run: bun run check:instagramTransport
      exclude: *prose

    - name: platforms
      run: bun run check:platforms
      glob:
        - &code "*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,py,json,jsonc,toml,yml,yaml,css,html,lock}"
        - "docs/platforms/**"
        - "docs/*Platform.md"

    - name: agnostic
      run: bun scripts/checks/cachedCheck.ts check:agnostic
      glob: &surface
        - *code
        - "AGENTS.md"
        - "docs/useCases/**"
        - "docs/guides/**"
        - "docs/harnesses/**"
        - "skills/**"

    - name: platformNeutral
      run: bun run check:platformNeutral
      glob: *surface

    - name: agentWording
      run: bun run check:agentWording
      glob:
        - "README.md"
        - "AGENTS.md"
        - "llms.txt"
        - "docs/trust.md"
        - "docs/accounts.md"
        - "docs/guides/**"
        - "docs/useCases/**"
        - "hermesPlugin/**"
        - ".claude/skills/**"
        - "scripts/checks/*AgentWording*"
        - "scripts/checks/agentWordingBaseline.json"

    - name: docLinks
      run: bun run check:docLinks
      glob:
        - "*.md"
        - "scripts/checks/*DocLinks*"

    - name: layout
      run: bun run check:layout

    - name: oneDatabase
      run: bun run check:oneDatabase
      exclude: *prose

    - name: hiddenWindows
      run: bun run check:hiddenWindows
      exclude: *prose

    - name: browserParity
      run: bun run check:browsers
      glob:
        - *code
        - "docs/browsers.md"
        - "site/apps/web/public/logos/**"

    - name: consoleParity
      run: bun run check:consoleParity
      exclude: *prose

    - name: cards
      run: bun run check:cards
      exclude: *prose

    - name: agentHooks
      run: bun scripts/checks/cachedCheck.ts check:agentHooks
      glob:
        - *code
        - "AGENTS.md"
        - "docs/useCases/**"
        - "docs/guides/**"
        - "docs/harnesses/**"
        - "skills/**"
        - "hermesPlugin/**"
        - ".codex/**"
        - ".claude/**"

    - name: docs
      run: bun run check:docs

    - name: siteDocs
      run: bun scripts/checks/cachedCheck.ts check:siteDocs
      glob:
        - "docs/**"
        - "site/apps/docs/**"
        - "scripts/docs/**"
        - "src/privacy/**"

    - name: siteSkills
      run: bun run check:siteSkills --staged
      glob:
        - "skills/**"
        - "docs/useCases/**"
        - ".claude/skills/**"
        - "hermesPlugin/skills/**"
        - "site/apps/web/public/.well-known/**"
        - "scripts/docs/**"
        - "scripts/privacy/**"
        - "src/privacy/**"

    - name: specs
      run: bun scripts/checks/cachedCheck.ts check:specs --staged
      glob:
        - *code
        - "docs/specs/**"

commit-msg:
  jobs:
    - name: commitLog
      run: node scripts/commitLog/commitLog.mjs --message {1}

post-commit:
  commands:
    commitLog:
      run: node scripts/commitLog/commitLog.mjs --committed

pre-push:
  jobs:
    - name: checks
      group:
        parallel: true
        jobs:
          - name: privacy
            run: bun run check:privacy

          - name: noComments
            run: bun run check:noComments

          - name: twikitTransport
            run: bun run check:twikitTransport

          - name: reverseChudTransport
            run: bun run check:reverseChudTransport

          - name: oneIdentity
            run: bun run check:oneIdentity

          - name: identityGate
            run: bun run check:identityGate

          - name: linkedinTransport
            run: bun run check:linkedinTransport

          - name: slackTransport
            run: bun run check:slackTransport

          - name: instagramTransport
            run: bun run check:instagramTransport

          - name: platforms
            run: bun run check:platforms

          - name: agnostic
            run: bun scripts/checks/cachedCheck.ts check:agnostic

          - name: agentWording
            run: bun run check:agentWording

          - name: docLinks
            run: bun run check:docLinks

          - name: platformNeutral
            run: bun run check:platformNeutral

          - name: naming
            run: bun run check:naming

          - name: layout
            run: bun run check:layout

          - name: oneDatabase
            run: bun run check:oneDatabase

          - name: hiddenWindows
            run: bun run check:hiddenWindows

          - name: browserParity
            run: bun run check:browsers

          - name: consoleParity
            run: bun run check:consoleParity

          - name: cards
            run: bun run check:cards

          - name: agentHooks
            run: bun scripts/checks/cachedCheck.ts check:agentHooks

          - name: docs
            run: bun run check:docs

          - name: siteDocs
            run: bun scripts/checks/cachedCheck.ts check:siteDocs

          - name: siteSkills
            run: bun run check:siteSkills

          - name: specs
            run: bun scripts/checks/cachedCheck.ts check:specs

          - name: clientDocs
            run: bun run check:clientDocs

    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test:affected
