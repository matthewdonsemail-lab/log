schemaVersion: 2
status: proposedImplementationContract
asOf: '2026-11-11'
sourceRevision: 4004558bdafcace630686df994d91254130659ab
purpose: 'Native Log specification: existing workspace SQLite is the private data foundation; hosted PostgreSQL
  owns identity, authorization and routing only.'
conventions:
  fieldNames: camelCase
  uuid: UUID stored as PostgreSQL uuid or canonical SQLite text
  timestampUtc: UTC timestamp; PostgreSQL timestamptz, new SQLite fields epoch milliseconds via repository codec
  existingTimeFields: Preserve current text and integer columns; normalize at DTO boundary without destructive rewrites.
  json: Validated against named contract; private payload JSON is prohibited in central metadata.
  tokenHash: Hash of high-entropy random token; raw secret issued once.
  newForeignKeys: Enforce within one store; opaque ids across stores require application checks, not SQL FKs.
  deletion: Restrict by default; revoke access separately from deleting private records.
  versioning: YAML version is specification version, independent from current SQLite user_version 17.
  defaults: Unspecified means required explicit input or migration mapping, not a guessed SQL default.
ownership:
  control: Hosted FastAPI/SQLModel/PostgreSQL identity, authorization and minimal routing.
  workspace: 'Selected persistent cloud runtime: SQLite log.db plus protected files.'
  browserHost: Where AdsPower actually runs; provided host holds its own protected profiles and management credential.
  client: Transient authorized console/AI results; clear old-team caches on team switch.
  crossStoreTransactions: None. Use operation identity, idempotency, fencing and reconciliation.
sources:
  sqlite:
  - src/storage/schema/helpers/inbox.ts
  - src/storage/schema/helpers/platformTables.ts
  - src/storage/schema/helpers/migrations.ts
  - src/storage/schema/client.ts
  domains:
  - src/storage/platform/types.ts
  - src/platformKit/session/types.ts
  - src/platformKit/session/client.ts
  - src/directApi/governor/client.ts
  decisions:
  - docs/proposals/listeningKitNativeData.md
  - docs/proposals/listeningKitInstanceContracts.md
  - docs/proposals/listeningKitAdsPower.md
  - docs/proposals/listeningKitTwentyCutover.md
  tregReference: docs/proposals/listeningKitTregArchitecture.md contains pinned Treg file links; these Log additions
    are not claimed to exist in Treg.
  ddia: docs/datamodel/Designing Data-Intensive Applications.md
