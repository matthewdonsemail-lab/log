        scopes: scopes
        revokedAt: timestampUtc?
    ApprovalView:
      type: object
      additionalProperties: false
      fields:
        id: uuid
        operationId: uuid
        expiresAt: timestampUtc
  endpoints:
  - method: POST
    path: /auth/email/start
    authorization: public + rate limit
    request:
      email: text
      returnContextId: uuid?
    response: AuthChallengeView
    authority: control.emailChallenges
    notes:
    - Same response shape for existing/new addresses; code delivery failure is recoverable and never logs code.
  - method: POST
    path: /auth/email/verify
    authorization: public + challenge attempt budget
    request:
      challengeId: uuid
      code: text
    response: SessionView + session cookie
    authority: control users/session transaction
  - method: GET
    path: /session
    authorization: website session
    request: null
    response: SessionView
    authority: control
  - method: POST
    path: /auth/logout
    authorization: website session + CSRF
    request: {}
    response: '204'
    authority: control.websiteSessions
  - method: POST
    path: /teams
    authorization: verified website session
    request:
      name: text
      slug: text
    response: TeamView
    authority: control teams + owner membership atomic
  - method: POST
    path: /session/team
    authorization: website session + current membership
    request:
      teamId: uuid
    response: SessionView
    authority: control.websiteSessions
    notes:
    - This changes website selection only, never another client grant.
  - method: GET
    path: /teams/{teamId}/members
    authorization: team membership
    request: null
    response: MemberView[]
    authority: control.memberships
  - method: PATCH
    path: /teams/{teamId}/members/{membershipId}
    authorization: owner/admin constrained role management
    request:
      role: role?
      status: membershipStatus?
    response: MemberView
    authority: control.memberships
    notes:
    - Only owner manages owner role; cannot remove/demote last owner.
  - method: POST
    path: /teams/{teamId}/invites
    authorization: owner/admin
    request:
      email: text
      role: admin | member
    response: InviteView
    authority: control.invites
    notes:
    - Token sent to intended address; invite DTO does not return tokenHash.
  - method: POST
    path: /invites/accept
    authorization: verified session + invited email
    request:
      token: secret
    response: TeamView
    authority: control invite consume + membership create atomic
  - method: GET
    path: /teams/{teamId}/workspaces
    authorization: team membership
    request: null
    response: WorkspaceView[]
    authority: control.workspaces
  - method: POST
    path: /teams/{teamId}/workspaces
    authorization: owner/admin
    request:
      provider: ownCloud | boat
      providerConnectionId: uuid?
    response: WorkspaceView
    authority: control.workspaces
    notes:
    - Boat creation uses explicit provider connection and authorized provisioning; no assumed paid allocation in
      this specification.
  - method: POST
    path: /teams/{teamId}/workspaceSelection
    authorization: owner/admin
    request:
      workspaceId: uuid
      expectedGeneration: integer
    response: WorkspaceView
    authority: control selection + fencing
    notes:
    - Reconcile/quiesce old active runtime before accepting effects on new route.
  - method: POST
    path: /teams/{teamId}/providerConnections
    authorization: owner/admin
    request:
      provider: boat
      credential: secret
    response: ProviderConnectionView
    authority: encrypted control providerConnections
    notes:
    - Credential input only; redact and never echo.
  - method: DELETE
    path: /teams/{teamId}/providerConnections/{id}
    authorization: owner/admin
    request: {}
    response: 204 revocation
    authority: control.providerConnections
    notes:
    - Disconnect access; do not delete workspace data or implicitly destroy provider runtime.
  - method: POST
    path: /teams/{teamId}/workspaces/{workspaceId}/pairings
    authorization: owner/admin
    request:
      challengeHash: text
    response: PairingView with one-time token
    authority: control.workspacePairings
  - method: POST
    path: /runtime/pair
    authorization: single-use pairing token + challenge proof
    request:
      pairingToken: secret
      challengeProof: secret
      installationId: uuid
    response: RuntimeCredentialView (secret once)
    authority: control pairing consume + runtimeCredential transaction
  - method: WSS
    path: /runtime/bridge
    authorization: runtime credential + active fenced lease
    request:
      handshake: BridgeHello
    response: BridgeEnvelope stream
    authority: control route; workspace execution
    notes:
    - Runtime initiates outbound connection; no public inbound listener required at runtime.
  - method: POST
    path: /teams/{teamId}/browserConnections
    authorization: owner/admin
    request:
      workspaceId: uuid
      mode: provided | own
    response: BrowserConnectionView
    authority: control opaque browser connection
    notes:
    - User-owned ADSPOWER_HOST/API_KEY saved beside installation via private bootstrap, never central request fields.
  - method: GET
    path: /teams/{teamId}/accounts
    authorization: team membership + selected ready workspace
    request:
      cursor: text?
      limit: integer?
    response: AccountView[] + cursor
    authority: workspace.platformAccounts via transient relay
  - method: POST
    path: /teams/{teamId}/operations
    authorization: current membership + tool permissions
    request:
      operationId: uuid
      tool: registeredTool
      args: toolArguments
      liveApprovalId: uuid?
    response: OperationView
    authority: workspace.operations; central metadata only
  - method: GET
    path: /teams/{teamId}/operations/{operationId}
    authorization: same team + resource permission
    request: null
    response: OperationView
    authority: workspace journal via relay
    notes:
    - If offline return offline + safe metadata; cannot return private cached result from control.
  - method: POST
    path: /teams/{teamId}/operations/{operationId}/cancel
    authorization: current resource permission
    request: {}
    response: OperationView
    authority: workspace
    notes:
    - Cancellation requested is not proof external effect did not happen.
  - method: GET
    path: /teams/{teamId}/usage
    authorization: team membership
    request:
      from: timestampUtc
      to: timestampUtc
    response: UsageView[]
    authority: control.usageBuckets
  - method: GET
    path: /teams/{teamId}/analytics
    authorization: team membership + ready workspace
    request:
      from: timestampUtc
      to: timestampUtc
    response: registered analytics DTO + provenance
    authority: workspace via relay
  - method: GET
    path: /teams/{teamId}/subscription
    authorization: team membership
    request: null
    response: SubscriptionView
    authority: not configured; no fabricated billing status
  - method: GET
    path: /.well-known/oauth-authorization-server
    authorization: public
    request: null
    response: OAuth metadata
    authority: control
    baseOverride: /
  - method: GET
    path: /.well-known/oauth-protected-resource
    authorization: public
    request: null
    response: MCP resource metadata
    authority: control
    baseOverride: /
  - method: GET
    path: /oauth/authorize
    authorization: website session; verify registered client
    request:
      client_id: text
      redirect_uri: uri
      code_challenge: text
      resource: uri
      scope: text
      state: text?
    response: sign-in/team/consent redirect or code
    authority: control
    baseOverride: /
  - method: POST
    path: /oauth/token
    authorization: code + PKCE OR refresh token
    request:
      grant_type: authorization_code | refresh_token | urn:ietf:params:oauth:grant-type:device_code
      client_id: registered client id
      code: authorization code?
      code_verifier: PKCE verifier?
      redirect_uri: registered redirect?
      refresh_token: refresh secret?
      device_code: device secret?
    response: OAuth tokens
    authority: control
    baseOverride: /
  - method: POST
    path: /oauth/revoke
    authorization: matching credential/client authority
    request:
      token: secret
    response: '200'
    authority: control
    baseOverride: /
  - method: POST
    path: /oauth/register
    authorization: client registration policy + rate limit
    request: validated OAuth client metadata
    response: client registration response
    authority: control.oauthClients
    baseOverride: /
  - method: POST
    path: /oauth/device/authorize
    authorization: registered CLI client
    request: client metadata
    response: device/user code + polling interval
    authority: control.cliAuthorizations
    baseOverride: /
  - method: POST
    path: /mcp
    authorization: valid MCP grant + membership + audience
    request: MCP JSON-RPC
    response: registered tool result; transient
    authority: workspace execution through scoped dispatcher
    baseOverride: /
  - method: GET
    path: /teams/{teamId}/grants
    authorization: current team membership; admin all, member own
    request: null
    response: GrantView[]
    authority: control.oauthGrants
  - method: POST
    path: /teams/{teamId}/grants/{grantId}/revoke
    authorization: owner/admin or grant owner
    request: {}
    response: '204'
    authority: control grant + access/refresh revocation
  - method: POST
    path: /teams/{teamId}/workspaces/{workspaceId}/revoke
    authorization: owner/admin
    request: {}
    response: WorkspaceView
    authority: control runtime credentials/lease/route
  - method: POST
    path: /teams/{teamId}/operations/{operationId}/approval
    authorization: current membership + exact write permission + explicit user authorization
    request:
      requestHash: text
    response: ApprovalView
    authority: workspace.liveApprovals
  - method: POST
    path: /teams/{teamId}/invites/{inviteId}/revoke
    authorization: owner/admin
    request: {}
    response: '204'
    authority: control.invites
  errorCodes:
  - invalidInput
  - unauthenticated
  - forbidden
  - expiredChallenge
  - invalidCode
  - tooManyAttempts
  - inviteExpired
  - inviteWrongEmail
  - lastOwnerRequired
  - workspaceOffline
  - workspaceNotSelected
  - workspaceIncompatible
  - runtimeRevoked
  - leaseStale
  - idempotencyConflict
  - approvalRequired
  - approvalExpired
  - operationUnknown
  - schemaIncompatible
  - providerUnavailable
  - billingNotConfigured
  permissions:
    owner:
    - teamAdmin
    - invite
    - membershipAdmin
    - providerAdmin
    - workspaceAdmin
    - browserAdmin
    - readTools
    - approvedWriteTools
    - grantRevoke
    admin:
    - invite
    - nonOwnerMembershipAdmin
    - providerAdmin
    - workspaceAdmin
    - browserAdmin
    - readTools
    - approvedWriteTools
    member:
    - readTools
    - approvedWriteTools
    - ownGrantRevoke
    rule: Effective permission is intersection of current team role, client grant tool/scopes and exact live approval.
      A role alone never bypasses existing live/governor/account gates.
  domainDispatch:
    accounts: workspace.platformAccounts + secret adapters; observed identity stays in existing accounts
    inbox: existing chats/messages/identities/attachments/interactions/memberships through PlatformExtender
    jobs: operations as request envelope; existing jobs/jobLines and queues for actual execution
    browser: browserProfiles + actual browser host broker
    rule: Console and AI clients use the same registered dispatcher. No arbitrary SQL endpoint. Deferred legacy
      domains are not part of the native V1 tool surface.
  bodySchemaPolicy: Inline request shapes are named implementation contracts, not a ready OpenAPI file. Backend
    emits OpenAPI after Pydantic validators are implemented; frontend generated types then consume it.
frontend:
  status: proposed
  framework: existing React site
  routes:
  - path: /sign-in
    view: email entry
    backend:
    - POST /auth/email/start
    states:
    - idle
    - sending
    - codeRequired
    - rateLimited
    - deliveryFailed
  - path: /verify
    view: OTP verification
    backend:
    - POST /auth/email/verify
    states:
    - waiting
    - verifying
    - invalidCode
    - expiredChallenge
    - signedIn
  - path: /teams
    view: create/join/select team
    backend:
    - GET /session
    - POST /teams
    - POST /session/team
    - POST /invites/accept
    states:
    - noMembership
    - selectTeam
    - inviteExpired
    - inviteWrongEmail
    - ready
  - path: /console/accounts
    view: workspace status and private account list
    backend:
    - GET /teams/{teamId}/workspaces
    - GET /teams/{teamId}/accounts
    - POST /teams/{teamId}/operations
    states:
    - setupRequired
    - loading
    - ready
    - offline
    - incompatible
    - error
  - path: /console/settings
    view: profile/team/members/provider/workspace/browser setup and revocation
    backend:
    - GET /session
    - team membership/invite endpoints
    - workspace/pairing/browser/provider endpoints
    states:
    - loading
    - ready
    - saving
    - conflict
    - error
  - path: /console/usage
    view: minimal service counts/timing
    backend:
    - GET /teams/{teamId}/usage
    states:
    - loading
    - ready
    - empty
    - error
  - path: /console/analytics
    view: private workspace metrics with provenance
    backend:
    - GET /teams/{teamId}/analytics
    states:
    - loading
    - ready
    - empty
    - offline
    - error
  - path: /console/subscription
    view: actual billing availability
    backend:
    - GET /teams/{teamId}/subscription
    states:
    - notConfigured
  - path: /console/mcp
    view: connect client, consent and revoke grants
    backend:
    - OAuth routes
    - grant list/revoke endpoints
    states:
    - signedOut
    - selectTeam
    - consentRequired
    - authorized
    - revoked
    - workspaceOffline
  routeAliases:
    /login: /sign-in
    /console: /console/accounts
    /workspaces: workspace setup in /console/settings
    /mcp: /console/mcp
  rules:
  - Protected pages retain only validated internal return paths.
  - No credential fields in account DTOs; platform login happens through the authorized workspace operation/browser
    flow.
  - Never display cached private results from a prior user/team/workspace after context switch.
  - Offline shows unavailable, not zero accounts or fabricated empty analytics.
  - AI generated UI consumes same DTO/tool contracts; no second user/team/session model.
consistency:
  controlTransactions:
  - Create team + owner membership atomically.
  - Accept invite + membership once; verified email matches invite.
  - Consume OTP + create/resume user + session atomically.
  - Consume authorization code / rotate refresh token once.
  - Select workspace + advance generation + revoke stale dispatch route atomically.
  - Runtime lease acquire/renew uses compare-and-swap fencing generation.
  workspaceTransactions:
  - Insert operation + dedupe key before dispatch; same key/different hash refuses.
  - Commit platform observation with required event/projection changes according to current ingestion semantics.
  - Persist refreshed session only after confirmed platform response.
  - Consume write approval before external effect, record outcome/unknown separately.
  - Import native account configuration with stable platform/account keys; stop the prior writer before activating
    the new repository.
  crossStore: No distributed transaction assumption. Host metadata is a routing view; workspace operations journal
    decides actual effect/result. Host timeout is not platform failure.
  tenantChecks: Every path/body id resolved within current team/workspace. Composite SQL constraints where possible
    plus application checks on polymorphic/external refs.
  newSqlitePragmas: Enable foreign_keys on every connection for new enforced references after compatible migration;
    existing snapshot remains unchanged until implementation.
  optimisticConcurrency: revision/If-Match for mutable native records; return conflict instead of lost update.
  refreshConcurrency: Lock token/family row or atomic update; reuse detection cannot mint two successors.
retention:
  status: recommended V1 constants; must be implemented/configured before release
  emailCodeSeconds: 600
  authorizationCodeSeconds: 60
  pairingSeconds: 600
  accessTokenSeconds: 3600
  refreshTokenDays: 30
  websiteSessionDays: 30
  leaseSeconds: 60
  leaseHeartbeatSeconds: 20
  operationMetadataDays: 7
  controlAuditDays: 30
  usageBucketDays: 90
  transientRelayBufferSeconds: 60
  transientRelayBufferMaxBytes: 8388608
  privateData: No automatic private-record deletion introduced; explicit per-workspace retention for captures/media/results/backups
    and retained imports.
  expiredAuth: Consume/revoke immediately; retention cleanup never restores validity.
  sourceNote: Access/refresh/code defaults match current MCP constants; other values are proposed defaults, not
    previously approved infrastructure settings.
migrationPlan:
  control: Versioned backend-owned SQLModel/Alembic migrations under python/controlService/migrations/versions;
    no schema auto-create in production startup.
  workspace: Append to current migration list; allocate next version from HEAD when implementing, not from this
    snapshot. Respect minReaderVersion and transactional migration behavior.
  sourceSnapshot: Existing definitions reflect checked-in migrations, not a dump of Matt private database.
  order:
  - Preserve current SQLite schema and identify active account/session read and refresh-write boundaries.
  - Implement platformAccounts and secret adapters; preserve current identity keys, queues, jobs, governors and
    browser storage.
  - Implement hosted identity/team OTP sessions and scoped grants.
  - Implement pairing, fencing, outbound bridge and operations request envelope using existing execution machinery.
  - Implement frontend DTOs/routes and CLI authorization; hide deferred features from native tool surface.
  - Reconcile active account configuration, update generators/guides/defaults and perform controlled writer cutover.
  recovery: Snapshot DB consistently with WAL and mounted private files; encryption key handled separately. Restore
    to same workspace identity with old runtime fenced before resuming.
  acceptance:
  - No central table or log stores private account/message/tool payload.
  - Tenant mismatch, revoked membership/grant and stale generation all refuse execution.
  - Existing event/projection schemas preserved; unknown side effects reconcile before retry.
  - Complete new-user and returning-user flow resolves offline/setup states accurately.
  - No Agency-prefixed native model, legacy field inventory or CRM/SMS/listing data model; every new private table
    has a role missing from existing SQLite.
  implementationStatus: No migrations, deployments or application code changes performed by this schema specification.
  importBoundary: Legacy export types are permitted only inside an explicit importer for an active supported capability.
    Do not port old domains merely because their types exist. Deferred domains require a separate specification
    when resumed.
deploymentConfig:
  status: proposed names/roles; not consumed by current code unless already noted
  control:
    databaseUrl: PostgreSQL connection secret
    sessionSecret: SESSION_SECRET; independent server-side website session key outside DB
    otpPepper: OTP_PEPPER; independent server-side email-code verifier key outside DB
    providerEncryptionKey: key outside PostgreSQL/backups; versioned
    dispatchSigningKey: DISPATCH_SIGNING_KEY; private key outside DB; runtime verifies pinned public trust
    emailApiKey: accepted Resend secret
    emailFrom: verified sending identity from provisioning
    publicAppOrigin: single configured HTTPS application origin
    mcpResourceUrl: registered HTTPS resource/audience; exact origins and redirects
  workspace:
    LOG_DB: existing SQLite path override
    LOG_INBOX_STATE: existing alternate root
    LOG_HOME: existing runtime state root; inventory callers instead of assuming it covers all paths
    workspaceCredential: protected paired runtime secret
    workspaceEncryptionKey: outside DB, separately recoverable
    ADSPOWER_HOST: existing, private installation endpoint
    ADSPOWER_API_KEY: existing, local installation secret; no control DB copy
  bootstrap:
  - Resolve persistent state and actual browser roots; refuse ephemeral storage for persistent runtime readiness.
  - Create or resume installation identity without regenerating account profiles.
  - Apply compatible native migrations; refuse incompatible reader.
  - Pair/exchange one-time authority, save secret with restrictive ACL.
  - Probe capabilities, acquire active lease and open outbound bridge.
  - Resume/reconcile private jobs under current permissions; never blindly replay unknown writes.
  notRequired:
  - legacy Twenty credentials for native startup
  - AI provider website OAuth for initial email sign-in
  - another default private database server
scope:
  basis:
  - Existing log.db schema and PlatformExtender ingestion contract
  - Existing private .logCli engine/session files
  - Accepted hosted identity, team, pairing and routing contracts
  deferred:
  - Old listing and campaign features and their migration
  - CRM and SMS-specific data models
  - Separate knowledge-domain redesign
  rule: Do not derive native tables or fields from generated Twenty objects. Legacy import is an isolated adapter,
    never the target schema.
