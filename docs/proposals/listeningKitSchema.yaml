apiContracts:
  status: proposed; no routes claimed implemented
  base: /api/v1
  wire:
    fieldNames: camelCase
    timestamps: RFC3339 UTC
    ids: opaque strings
    money: decimal strings
    pagination: cursor + limit; stable order; opaque cursor scoped to team/workspace/query
    writes: Idempotency-Key for accepted operations; If-Match revision for editable records
    errors: ErrorView; central safe error codes only; private detail relayed only to current authorized caller
    browserAuth: Secure HttpOnly SameSite cookie; CSRF protection and exact origin validation on state-changing
      session routes
    mcpAuth: OAuth bearer audience/resource + scopes + membership + team grant
    cache: Cache-Control no-store for private/auth responses; frontend clears scoped state and cancels old queries
      on team/workspace switch
    protocolBoundary: OAuth/MCP standards retain their mandated field names (e.g. grant_type); convert once at application
      boundary. Internal models/Log DTOs use camelCase.
