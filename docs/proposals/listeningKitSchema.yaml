  projectionPolicy: Only projections with proven event/source coverage are rebuildable. Preserve source-owned workflow
    edits separately; replay must not erase them.
  existingNoSqlFkPolicy: Snapshot preserves current foreign key declarations exactly. New constraints apply only
    through explicit compatible migrations; existing identity relationships are not silently rekeyed or retrofitted.
  fileStores:
  - name: accountConfiguration
    current: LOG_LOCAL_ACCOUNTS or ~/.logCli/localAccounts.json
    target: Explicit import of only current platform/account configuration into platformAccounts and secrets; preserve
      stable identity keys. Imported JSON becomes retained read-only evidence after writer cutover.
    authority: workspace
  - name: platformState
    current: platformStateRoot and per-account governor_state.json
    target: Keep current private files and their meaning through scoped adapters; no second governor or lifecycle
      table.
    authority: workspace
  - name: browserProfiles
    current: Installation-managed browser profile directory
    target: Keep actual profile files beside browser installation, with broker leases when provided remotely.
    authority: actual browser host
  - name: capturesAndMedia
    current: Existing runs, media, blob, transcript and search storage
    target: Keep current private paths and SQLite references; no new artifact or message body catalog.
    authority: workspace or actual browser host
  - name: configurationAndSecrets
    current: Existing private platform/config/session files
    target: Native credential adapter resolves protected paths or encrypted secrets by kind; hosted Boat connection
      remains the accepted control exception.
    authority: workspace
  nativeIdentityContract:
    keys: Preserve (platform, account), chatId, messageKey, eventId and event seq exactly as existing ingestion
      defines them.
    accounts: Existing accounts maps a platform/account key to its observed upstream userId; platformAccounts adds
      configuration and secret references only.
    memberships: SQLite memberships means platform room membership. Control memberships means website team authorization.
      These remain separate stores.
    extenders: PlatformExtender maps EventInput through toChat, toIdentities, toMessage, toAttachments and toInteraction.
      No per-platform duplicate message schema.
    recordsAndState: Keep existing RecordKind and StateScope unions; adding a new kind/scope requires a separately
      reviewed code migration.
    jobsAndQueues: Use existing jobs/jobLines and queues/queueLog/queueIncoming/queueLocks/queueNudges. operations
      is the hosted dispatch idempotency/authorization envelope, not a replacement scheduler or duplicate job log.
    sessions: Current PlatformAccount aliases FacebookAccount and findPlatformAccount queries Twenty. Replace this
      execution boundary with the native account repository; change session refresh writes too. This is proposed
      work, not current native capability.
  existingGovernorPolicy: Preserve governor_state.json and source field units/buckets. Access through the selected
    workspace/account adapter. No imported counters in a parallel table and no automatic reset.
schemas:
  redirectUris:
    type: array
    items: absoluteUri
    maxItems: 20
    validation: Exact registered redirects; HTTPS except supported loopback CLI redirects.
  scopes:
    type: array
    items: registeredScope
    uniqueItems: true
    validation: Reject unsupported scopes; never widen during refresh.
  tags:
    type: array
    items: text
    maxItems: 100
  fieldNames:
    type: array
    items: text
  capabilitySummary:
    type: object
    additionalProperties: false
    fields:
      persistentStorage: boolean
      browserAvailable: boolean
      driver: adsPower | camoufox | none
      protocolVersion: integer
      checkedAt: timestampUtc
      status: pending | passed | failed
    notes:
    - Only safe capability summary centrally. Detailed paths/probe output stay private.
    - ChatGPT/Claude connection is not capability evidence.
  accountSettings:
    type: object
    additionalProperties: false
    fields:
      homeCountry: countryCode?
      homeTimezone: text?
      activeHoursStart: decimal?
      activeHoursEnd: decimal?
      requestsPerHour: integer?
      requestsPerDay: integer?
      writesPerDay: integer?
    notes:
    - Optional operational configuration only; do not invent defaults that reset existing limits.
    - Platform adapter validates supported settings. Platform-specific capabilities are not universal account columns.
    - Browser/profile binding is separate; session and login material never appears in this object.
  platformLogin:
    type: adapterValidatedSecret
    discriminator: platform
    notes:
    - Only credentials required by the selected platform adapter, encrypted in the workspace. No universal CRM,
      phone or provider-specific credential schema.
    - Secret values never appear in console list DTOs or hosted metadata.
  platformSession:
    type: adapterValidatedSecret
    discriminator: platform
    notes:
    - Preserve the engine session representation, including cookies/storage only where used.
    - Session refresh has one private writer and optimistic version checks; never silently overwrite a newer session.
  toolArguments:
    type: object
    source: Registered command input schema
    validation: Tool-specific validator, bounded sizes, no universal arbitrary executable payload; private to workspace.
  toolResult:
    type: object
    source: Registered command result schema
    validation: Tool-specific result, redact secrets, artifact handles instead of arbitrary filesystem URLs.
  privateError:
    type: object
    additionalProperties: false
    fields:
      code: registeredErrorCode
      message: text
      evidenceRef: privateCaptureRef?
  BridgeHello:
    type: object
    additionalProperties: false
    fields:
      workspaceId: uuid
      installationId: uuid
      protocolVersion: integer
      runtimeVersion: text
      schemaVersion: integer
      capabilities: capabilitySummary
      lastProgressCursor: opaqueId?
    notes:
    - Authenticate transport with runtime credential; credential is not a logged body field.
  BridgeEnvelope:
    type: object
    additionalProperties: false
    fields:
      protocolVersion: integer
      kind: dispatch | accepted | progress | result | reconcile | cancel | heartbeat
      workspaceId: uuid
      routeGeneration: integer
      operationId: uuid?
      sequence: integer?
      authority: ExecutionAuthority?
      payload: toolArguments | toolResult | privateError | null
    notes:
    - Transient payload only at gateway. Durable args/results exist only in workspace operations/jobs.
    - Bound memory buffers, payload size and lifetime; reject overflow. No SQL payload fallback.
  ExecutionAuthority:
    type: object
    additionalProperties: false
    fields:
      teamId: uuid
      workspaceId: uuid
      actorUserId: uuid?
      grantId: uuid?
      tool: registeredTool
      requestHash: text
      routeGeneration: integer
      authzVersion: integer
      issuedAt: timestampUtc
      expiresAt: timestampUtc
      signature: text
    notes:
    - Authenticated signed dispatch envelope; grant revocation/membership checked immediately before dispatch.
    - Runtime rechecks lease/generation/expiry and exact request hash before side effects. Long-running operations
      need renewed current authority at write boundaries.
  ProviderConnectionView:
    type: object
    additionalProperties: false
    fields:
      id: uuid
      provider: boat
      status: text
