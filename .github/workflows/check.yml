name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v6

      - name: Python for the engines
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r vendor/twikit/requirements.txt ./vendor/fbk ./vendor/endcord ./vendor/openLinkedinApi "./vendor/instagrapi[curl]" vendor/chatXdk/wheels/chatxdk-0.5.2-cp310-abi3-win_amd64.whl
          echo "LOG_PYTHON=$(cygpath -w "$PWD/.venv/Scripts/python.exe")" >> "$GITHUB_ENV"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check (every lefthook gate, the spec gate on SubQ, then typecheck and tests)
        env:
          SUBQ_API_KEY: ${{ secrets.SUBQ_API_KEY }}
        run: bun run check
