<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>X — Human verification (mock session view)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: #0f1419;
    color: #e7e9ea;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .browserbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1c232b;
    padding: 10px 14px;
    font-size: 12px;
    color: #8b98a5;
  }
  .browserbar .dots { display: flex; gap: 5px; }
  .browserbar .dots span { width: 9px; height: 9px; border-radius: 50%; background: #3a4450; }
  .browserbar .url {
    flex: 1;
    background: #0f1419;
    border-radius: 8px;
    padding: 5px 12px;
    border: 1px solid #333639;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 16px; }
  .card {
    width: 100%;
    max-width: 420px;
    background: #161d25;
    border-radius: 18px;
    border: 1px solid #333639;
    padding: 28px 26px;
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9dc2f7;
    background: #22314d;
    border-radius: 999px;
    padding: 5px 12px;
  }
  h1 { font-size: 20px; margin: 14px 0 6px; }
  p { font-size: 14px; line-height: 1.55; color: #b7bfc7; margin: 0 0 16px; }
  .verify {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0f1419;
    border: 1px solid #333639;
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    user-select: none;
  }
  .verify input {
    width: 22px;
    height: 22px;
    accent-color: #2a8cff;
    cursor: pointer;
  }
  .verify span { font-size: 14px; }
  .verify .provider { margin-left: auto; font-size: 11px; color: #8b98a5; }
  #status { min-height: 20px; margin-top: 12px; font-size: 13px; color: #9dc2f7; font-weight: 600; }
  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 3px solid #333639;
    border-top-color: #2a8cff;
    border-radius: 50%;
    margin: 12px auto 0;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="browserbar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="url">x.com/account/verify — mocked session view</div>
  </div>
  <main>
    <div class="card">
      <span class="badge">Mock challenge</span>
      <h1>Verify you are human</h1>
      <p>X served an Arkose challenge before any data &mdash; &ldquo;this request looks like it might be automated&rdquo; (code 226). Tick the box to pass it.</p>
      <label class="verify">
        <input id="human" type="checkbox" />
        <span>I am human</span>
        <span class="provider">Arkose mock</span>
      </label>
      <div class="spinner" id="spinner"></div>
      <div id="status" role="status"></div>
    </div>
  </main>
<script>
  (function () {
    var PLATFORM = 'x';
    var box = document.getElementById('human');
    var spinner = document.getElementById('spinner');
    var status = document.getElementById('status');
    box.addEventListener('change', function () {
      if (!box.checked) return;
      box.disabled = true;
      spinner.style.display = 'block';
      status.textContent = 'Checking with the challenge provider…';
      window.setTimeout(function () {
        spinner.style.display = 'none';
        status.textContent = 'Challenge passed — you can return to ListeningKit.';
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'lk:challenge-solved', platform: PLATFORM }, window.location.origin);
        }
      }, 1200);
    });
  })();
</script>
</body>
</html>
