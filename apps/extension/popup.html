<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ListeningKit Connect</title>
<style>
  :root { color-scheme: light; --blue: #2a8cff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; }
  * { box-sizing: border-box; }
  body { display: flex; width: 360px; min-height: 390px; margin: 0; padding: 20px 24px 24px; flex-direction: column; align-items: center; font: 14px/1.45 'Satoshi', 'Inter', system-ui, sans-serif; color: #fff; background: #2a8cff; }
  header { width: 100%; margin-bottom: 20px; color: #fff; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 800; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; }
  h1 { margin: 0 0 18px; font-size: 22px; line-height: 1.15; color: #0f172a; text-align: center; }
  p { margin: 0 0 12px; color: rgba(255,255,255,.8); text-align: center; }
  .status { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: #f1f5f9; color: var(--ink); }
  .status.ok { background: #dcfce7; }
  .status.warn { background: #fef3c7; }
  button, a.btn { display: block; width: 100%; margin: 0 0 8px; padding: 11px 14px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--blue); color: #fff; }
  button.primary:disabled { opacity: .6; cursor: default; }
  a.btn { background: #f1f5f9; color: var(--ink); }
  .note { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
  section, #status, #copy, #save-panel, #saved, #sites, .note { margin-left: 0; margin-right: 0; }
  #signed-out, #signed-in { width: 100%; }
  .section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .section-title { margin: 0 0 9px; font-size: 13px; font-weight: 800; }
  label { display: block; margin: 9px 0; color: var(--muted); font-size: 12px; font-weight: 700; }
  input { display: block; width: 100%; margin-top: 4px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; color: var(--ink); }
  .auth-card { width: 100%; padding: 24px; border-radius: 24px; background: #fbfcfe; }
  .oauth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .oauth-grid button { display: flex; align-items: center; justify-content: center; gap: 8px; background: #eef4fb; color: var(--ink); }
  .oauth-grid img { width: 20px; height: 20px; }
  .divider { display: flex; align-items: center; gap: 8px; margin: 16px 0; color: #94a3b8; font-size: 12px; }
  .divider::before, .divider::after { height: 1px; flex: 1; background: var(--line); content: ''; }
  .profile { margin: 8px 0; padding: 10px; border: 1px solid var(--line); border-radius: 9px; }
  .profile-head { display: flex; justify-content: space-between; gap: 8px; }
  .profile-name { font-weight: 800; }
  .profile-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .profile-actions { display: flex; gap: 6px; margin-top: 8px; }
  .profile-actions button { margin: 0; padding: 7px 8px; font-size: 12px; }
  button.secondary { background: #eef4fb; color: var(--ink); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header><div class="brand"><img class="brand-mark" src="logo.svg" alt="ListeningKit logo"><span>ListeningKit</span></div></header>
  <p id="status" class="status" hidden></p>
  <button id="copy" class="primary" type="button" hidden>Copy token</button>
  <div id="sites" hidden>
    <a class="btn" href="https://www.reddit.com/" target="_blank" rel="noreferrer">Open Reddit</a>
    <a class="btn" href="https://x.com/" target="_blank" rel="noreferrer">Open X</a>
    <a class="btn" href="https://www.facebook.com/" target="_blank" rel="noreferrer">Open Facebook</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
