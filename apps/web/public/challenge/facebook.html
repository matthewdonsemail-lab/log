<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Facebook — Security checkpoint (mock session view)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: #eef3fa;
    color: #0b0b0c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .browserbar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #dfe7f3;
    padding: 10px 14px;
    font-size: 12px;
    color: #5b6472;
  }
  .browserbar .dots { display: flex; gap: 5px; }
  .browserbar .dots span { width: 9px; height: 9px; border-radius: 50%; background: #b9c4d6; }
  .browserbar .url {
    flex: 1;
    background: #fff;
    border-radius: 8px;
    padding: 5px 12px;
    border: 1px solid #d3dbe7;
  }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 16px; }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 18px;
    border: 1px solid #e4e7ec;
    box-shadow: 0 18px 48px -20px rgba(11, 59, 143, 0.35);
    padding: 28px 26px;
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0b3b8f;
    background: #d3e5fa;
    border-radius: 999px;
    padding: 5px 12px;
  }
  h1 { font-size: 20px; margin: 14px 0 6px; }
  p { font-size: 14px; line-height: 1.55; color: #3c4450; margin: 0 0 14px; }
  .attempt {
    font-size: 13px;
    background: #f4f9ff;
    border: 1px solid #d3e5fa;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    color: #0b3b8f;
  }
  button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #2a8cff;
    color: #fff;
  }
  button:disabled { background: #9dc2f7; cursor: default; }
  .ghost { background: #eef3fa; color: #0b3b8f; margin-top: 8px; }
  #status { min-height: 20px; margin-top: 12px; font-size: 13px; color: #0b3b8f; font-weight: 600; }
  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 3px solid #d3e5fa;
    border-top-color: #2a8cff;
    border-radius: 50%;
    margin: 12px auto 0;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="browserbar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="url">facebook.com/checkpoint — mocked session view</div>
  </div>
  <main>
    <div class="card">
      <span class="badge">Mock challenge</span>
      <h1>Confirm it&rsquo;s you</h1>
      <p>Facebook paused this session after an automated-looking login. Confirm the attempt below to lift the checkpoint.</p>
      <div class="attempt">New login &middot; Camoufox session &middot; just now</div>
      <button id="approve" type="button">This was me</button>
      <button id="deny" class="ghost" type="button">This wasn&rsquo;t me</button>
      <div class="spinner" id="spinner"></div>
      <div id="status" role="status"></div>
    </div>
  </main>
<script>
  (function () {
    var PLATFORM = 'facebook';
    var approve = document.getElementById('approve');
    var deny = document.getElementById('deny');
    var spinner = document.getElementById('spinner');
    var status = document.getElementById('status');
    function notifySolved() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'lk:challenge-solved', platform: PLATFORM }, window.location.origin);
      }
    }
    approve.addEventListener('click', function () {
      approve.disabled = true;
      deny.disabled = true;
      spinner.style.display = 'block';
      status.textContent = 'Verifying with Facebook…';
      window.setTimeout(function () {
        spinner.style.display = 'none';
        status.textContent = 'Checkpoint cleared — you can return to ListeningKit.';
        notifySolved();
      }, 900);
    });
    deny.addEventListener('click', function () {
      status.textContent = 'Reported. ListeningKit will keep this account paused.';
    });
  })();
</script>
</body>
</html>
